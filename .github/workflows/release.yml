name: Release backend bundle

# Pushing a tag like v1.0.0 (or running `gh release create v1.0.0`) builds the
# dashboard, bundles it with the PocketBase linux binary + hooks + migrations,
# and attaches the zip to a GitHub Release. The asset name is stable so the
# droplet can always fetch releases/latest/download/equine-backend-linux-amd64.zip
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PB_VERSION: "0.39.10"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Download PocketBase binary (linux amd64)
        run: |
          curl -fsSL -o pb.zip \
            "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -o pb.zip pocketbase -d bundle
          chmod +x bundle/pocketbase

      - name: Assemble bundle
        run: |
          cp -r pocketbase/pb_hooks bundle/
          cp -r pocketbase/pb_migrations bundle/
          cp -r pocketbase/pb_public bundle/
          cp -r deploy bundle/
          cd bundle && zip -r ../equine-backend-linux-amd64.zip . && cd ..
          unzip -l equine-backend-linux-amd64.zip | tail -5

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" equine-backend-linux-amd64.zip \
            --title "Equine backend ${GITHUB_REF_NAME}" \
            --generate-notes
